<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Speech-to-Speech Demo</title>
        <style>
            :root {
                --primary: #00f2fe;
                --secondary: #4facfe;
                --bg-dark: #0f172a;
                --card-bg: rgba(30, 41, 59, 0.7);
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #38bdf8;
                --success: #4ade80;
                --error: #ef4444;
                --warning: #fbbf24;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: radial-gradient(
                    circle at top right,
                    #1e293b 0%,
                    #0f172a 100%
                );
                color: var(--text-main);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                padding: 20px;
                line-height: 1.6;
            }

            .container {
                max-width: 600px;
                width: 100%;
                margin: 0 auto;
                background: rgba(15, 23, 42, 0.6);
                border-radius: 24px;
                box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
                padding: 40px;
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            header {
                text-align: center;
                margin-bottom: 40px;
            }

            .logo {
                font-size: 3rem;
                margin-bottom: 16px;
                display: inline-block;
                filter: drop-shadow(0 0 20px rgba(79, 172, 254, 0.4));
            }

            h1 {
                font-size: 2.5rem;
                font-weight: 800;
                background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 8px;
                letter-spacing: -1px;
            }

            .subtitle {
                color: var(--text-muted);
                font-size: 1.1rem;
            }

            .cold-start-note {
                color: var(--accent);
                font-size: 0.85rem;
                margin-top: 12px;
                padding: 8px 16px;
                background: rgba(56, 189, 248, 0.1);
                border-radius: 8px;
                border: 1px solid rgba(56, 189, 248, 0.2);
            }

            .card {
                background: var(--card-bg);
                border-radius: 16px;
                padding: 24px;
                margin-bottom: 24px;
                border: 1px solid rgba(255, 255, 255, 0.05);
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
            }

            .card:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
                border-color: rgba(255, 255, 255, 0.1);
            }

            .card h2 {
                font-size: 0.9rem;
                color: var(--accent);
                margin-bottom: 16px;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .btn {
                background: linear-gradient(
                    135deg,
                    var(--secondary) 0%,
                    var(--primary) 100%
                );
                border: none;
                padding: 16px;
                border-radius: 12px;
                color: #fff;
                font-size: 1.1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                width: 100%;
                margin-bottom: 16px;
                position: relative;
                overflow: hidden;
            }

            .btn:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            }

            .btn:active:not(:disabled) {
                transform: translateY(0);
            }

            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                filter: grayscale(100%);
            }

            #recordBtn.recording {
                background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
                }
                70% {
                    box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
                }
            }

            .status {
                text-align: center;
                padding: 16px;
                color: var(--text-muted);
                font-size: 0.95rem;
                min-height: 56px;
            }

            .status.processing {
                color: var(--accent);
            }

            .spinner {
                display: inline-block;
                width: 18px;
                height: 18px;
                border: 2px solid rgba(56, 189, 248, 0.3);
                border-radius: 50%;
                border-top-color: var(--accent);
                animation: spin 1s linear infinite;
                margin-right: 8px;
                vertical-align: text-bottom;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .results {
                display: none;
                animation: slideUp 0.5s ease;
            }

            .results.show {
                display: block;
            }

            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .timing {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
                margin-bottom: 24px;
            }

            .timing-item {
                background: rgba(0, 0, 0, 0.2);
                padding: 14px 8px;
                border-radius: 12px;
                text-align: center;
                border: 1px solid rgba(255, 255, 255, 0.05);
            }

            .timing-item .value {
                font-size: 1.2rem;
                font-weight: 700;
                color: var(--success);
                font-feature-settings: "tnum";
            }

            .timing-item .value.fast { color: var(--success); }
            .timing-item .value.medium { color: var(--warning); }
            .timing-item .value.slow { color: var(--error); }

            .timing-item .label {
                font-size: 0.7rem;
                color: var(--text-muted);
                margin-top: 4px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .result-item {
                margin-bottom: 24px;
            }

            .result-item label {
                display: block;
                font-size: 0.9rem;
                color: var(--text-muted);
                margin-bottom: 8px;
                font-weight: 500;
            }

            .result-item p {
                background: rgba(0, 0, 0, 0.2);
                padding: 16px;
                border-radius: 12px;
                line-height: 1.7;
                color: var(--text-main);
                font-size: 1.05rem;
                border: 1px solid rgba(255, 255, 255, 0.05);
            }

            audio {
                width: 100%;
                height: 40px;
                border-radius: 8px;
                margin-top: 8px;
            }

            audio::-webkit-media-controls-panel {
                background-color: rgba(255, 255, 255, 0.1);
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 8px;
                font-size: 0.9rem;
            }

            th,
            td {
                padding: 12px;
                text-align: left;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            th {
                color: var(--text-muted);
                font-weight: 600;
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            td {
                color: var(--text-main);
            }

            .error-msg {
                background: rgba(239, 68, 68, 0.1);
                border: 1px solid rgba(239, 68, 68, 0.2);
                color: var(--error);
                padding: 16px;
                border-radius: 12px;
                text-align: center;
            }

            .live-text {
                color: var(--text-muted);
                font-style: italic;
                font-size: 0.9rem;
                min-height: 24px;
                transition: color 0.2s;
            }

            .live-text.active {
                color: var(--text-main);
                font-style: normal;
            }

            @media (max-width: 600px) {
                .timing {
                    grid-template-columns: repeat(3, 1fr);
                }
                .container {
                    padding: 24px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <div class="logo">🎙️</div>
                <h1>Real-Time Speech Intelligence</h1>
                <p class="subtitle">Real-time voice interaction</p>
                <p class="cold-start-note">
                    ⚡ First request may be slower (cold start). Subsequent
                    requests are much faster!
                </p>
            </header>

            <!-- Record -->
            <div class="card">
                <h2>🎤 Input</h2>
                <button class="btn" id="recordBtn">Start Recording</button>
                <p
                    id="recordingStatus"
                    style="
                        text-align: center;
                        color: var(--text-muted);
                        font-size: 0.9rem;
                        min-height: 20px;
                    "
                ></p>
            </div>

            <!-- Process Button -->
            <button class="btn" id="processBtn" disabled>Process Audio</button>

            <!-- Status -->
            <div class="status" id="status"></div>

            <!-- Results -->
            <div class="card results" id="results">
                <h2>📈 Performance Metrics</h2>

                <div class="timing">
                    <div class="timing-item">
                        <div class="value" id="ttfaTime">–</div>
                        <div class="label">TTFA</div>
                    </div>
                    <div class="timing-item">
                        <div class="value" id="totalTime">0.00s</div>
                        <div class="label">Total</div>
                    </div>
                    <div class="timing-item">
                        <div class="value" id="asrTime">0.00s</div>
                        <div class="label">ASR</div>
                    </div>
                    <div class="timing-item">
                        <div class="value" id="llmTime">0.00s</div>
                        <div class="label">LLM</div>
                    </div>
                    <div class="timing-item">
                        <div class="value" id="ttsTime">0.00s</div>
                        <div class="label">TTS</div>
                    </div>
                </div>

                <div class="result-item">
                    <label>You said:</label>
                    <p id="transcription">...</p>
                </div>

                <div class="result-item">
                    <label>AI Response:</label>
                    <p id="response" class="live-text">...</p>
                </div>

                <div class="result-item">
                    <label>Audio Output:</label>
                    <audio id="audioPlayer" controls></audio>
                </div>

                <!-- Latency Breakdown Table -->
                <div
                    class="result-item"
                    id="latencyBreakdownSection"
                    style="display: none"
                >
                    <label>⏱️ Detailed Latency</label>
                    <div
                        style="
                            overflow-x: auto;
                            background: rgba(0, 0, 0, 0.2);
                            border-radius: 12px;
                            padding: 0 16px;
                        "
                    >
                        <table id="latencyBreakdown">
                            <thead>
                                <tr>
                                    <th>Component</th>
                                    <th>Time</th>
                                    <th>%</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                        <div
                            id="rtfThroughput"
                            style="
                                padding: 16px 0;
                                color: var(--accent);
                                font-size: 0.9rem;
                                border-top: 1px solid rgba(255, 255, 255, 0.05);
                            "
                        ></div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Config - Your Modal endpoint URLs
            const USE_BINARY_TRANSPORT = true;
            const PROCESS_URL = USE_BINARY_TRANSPORT
                ? "https://lazy-chat--speech-to-speech-process-web-binary.modal.run"
                : "https://lazy-chat--speech-to-speech-process-web.modal.run";
            const MODELS_URL =
                "https://lazy-chat--speech-to-speech-get-models.modal.run";
            const STREAM_URL =
                "https://lazy-chat--speech-to-speech-process-web-stream-binary.modal.run";

            // Frame type constants (match backend)
            const FRAME_TYPE_AUDIO = 0x01;
            const FRAME_TYPE_META = 0x02;

            // Elements
            const recordBtn = document.getElementById("recordBtn");
            const recordingStatus = document.getElementById("recordingStatus");
            const processBtn = document.getElementById("processBtn");
            const status = document.getElementById("status");
            const results = document.getElementById("results");

            let mediaRecorder;
            let audioChunks = [];
            let recordedBlob = null;

            // Helper to format metrics safely
            const formatMetric = (val, suffix = "s") => {
                if (val === undefined || val === null || isNaN(val))
                    return "0.00" + suffix;
                return val.toFixed(2) + suffix;
            };

            const formatText = (text) => {
                if (!text || text === "undefined") return "...";
                return text;
            };

            // Color-code a timing value
            function colorTTFA(el, seconds) {
                el.classList.remove("fast", "medium", "slow");
                if (seconds < 1.0) el.classList.add("fast");
                else if (seconds < 2.0) el.classList.add("medium");
                else el.classList.add("slow");
            }

            recordBtn.addEventListener("click", async () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    recordBtn.textContent = "Start Recording";
                    recordBtn.classList.remove("recording");
                    recordingStatus.textContent = "Recording stopped.";
                    return;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                    });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        recordedBlob = new Blob(audioChunks, {
                            type: "audio/wav",
                        });
                        processBtn.disabled = false;
                        recordingStatus.textContent = "Ready to process.";
                        // Auto-process after recording for seamless experience
                        processBtn.click();
                    };

                    mediaRecorder.start();
                    recordBtn.textContent = "Stop Recording";
                    recordBtn.classList.add("recording");
                    recordingStatus.textContent = "Listening...";
                    processBtn.disabled = true;
                } catch (err) {
                    recordingStatus.textContent =
                        "Microphone access denied. Please allow permission.";
                    console.error(err);
                }
            });

            processBtn.addEventListener("click", async () => {
                if (!recordedBlob || recordedBlob.size === 0) {
                    alert("Please record some audio first.");
                    return;
                }

                processBtn.disabled = true;
                status.innerHTML =
                    '<span class="spinner"></span> Processing audio...';
                status.className = "status processing";
                results.classList.remove("show");

                // Reset display
                document.getElementById("ttfaTime").textContent = "–";
                document.getElementById("totalTime").textContent = "0.00s";
                document.getElementById("asrTime").textContent = "0.00s";
                document.getElementById("llmTime").textContent = "0.00s";
                document.getElementById("ttsTime").textContent = "0.00s";
                document.getElementById("transcription").textContent = "...";
                const responseEl = document.getElementById("response");
                responseEl.textContent = "...";
                responseEl.className = "live-text";
                document.getElementById("latencyBreakdownSection").style.display = "none";

                try {
                    const startTime = Date.now();

                    if (USE_BINARY_TRANSPORT) {
                        const wavPayload =
                            await blobToWavArrayBuffer(recordedBlob);

                        status.innerHTML =
                            '<span class="spinner"></span> Streaming...';
                        results.classList.add("show");

                        const streamResponse = await fetch(STREAM_URL, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/octet-stream",
                                "x-audio-format": "wav",
                                "x-sample-rate": String(wavPayload.sampleRate),
                                "x-channels": String(wavPayload.channels),
                                "x-sample-width": String(
                                    wavPayload.sampleWidth,
                                ),
                            },
                            body: wavPayload.buffer,
                        });

                        if (!streamResponse.ok) {
                            throw new Error(
                                `HTTP ${streamResponse.status}: ${await streamResponse.text()}`,
                            );
                        }

                        const streamResult = await streamBinaryAudio(streamResponse, startTime);
                        const clientTime = (Date.now() - startTime) / 1000;

                        // Update metrics from stream result
                        document.getElementById("totalTime").textContent =
                            formatMetric(clientTime);

                        if (streamResult.metrics) {
                            const m = streamResult.metrics;
                            document.getElementById("asrTime").textContent =
                                formatMetric(m.asr_time);
                            document.getElementById("llmTime").textContent =
                                formatMetric(m.llm_time);
                            document.getElementById("ttsTime").textContent =
                                formatMetric(m.tts_time);

                            // Detailed breakdown
                            const asr = m.asr_time || 0;
                            const llm = m.llm_time || 0;
                            const tts = m.tts_time || 0;
                            const pipeline = m.total_time || 0.001;
                            const output_dur = m.output_duration || 0;
                            const getPct = (val) =>
                                ((val / pipeline) * 100).toFixed(1) + "%";
                            const rtf = clientTime > 0 ? (output_dur / clientTime).toFixed(2) : "0.00";

                            const latencyRows = [
                                ["ASR", formatMetric(asr), getPct(asr), "Speech → Text"],
                                ["LLM", formatMetric(llm), getPct(llm), "Text Gen"],
                                ["TTS", formatMetric(tts), getPct(tts), `Text → ${output_dur.toFixed(1)}s Audio`],
                                ["TTFA", formatMetric(streamResult.ttfa), "-", "Time to First Audio"],
                                ["Pipeline", formatMetric(pipeline), "100%", "Server Processing"],
                                ["End-to-End", formatMetric(clientTime), "-", "Total Latency"],
                            ];

                            const tbody = document.querySelector("#latencyBreakdown tbody");
                            tbody.innerHTML = "";
                            latencyRows.forEach((row) => {
                                const tr = document.createElement("tr");
                                row.forEach((cell) => {
                                    const td = document.createElement("td");
                                    td.textContent = cell;
                                    tr.appendChild(td);
                                });
                                tbody.appendChild(tr);
                            });
                            document.getElementById("latencyBreakdownSection").style.display = "block";
                            document.getElementById("rtfThroughput").innerHTML =
                                `Throughput: <b>${rtf}x</b> realtime &nbsp;|&nbsp; Chunks: <b>${streamResult.audioChunks}</b>`;
                        }

                        if (streamResult.response) {
                            responseEl.textContent = streamResult.response;
                            responseEl.className = "live-text active";
                        }

                        status.textContent = "✅ Processing complete";
                        status.className = "status";
                    } else {
                        // Legacy JSON path
                        const base64Audio = await blobToBase64(recordedBlob);
                        const response = await fetch(PROCESS_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ audio_base64: base64Audio }),
                        });

                        const clientTime = (Date.now() - startTime) / 1000;

                        if (!response.ok) {
                            throw new Error(
                                `HTTP ${response.status}: ${await response.text()}`,
                            );
                        }

                        const data = await response.json();
                        const metrics = data.metrics || {};

                        document.getElementById("totalTime").textContent =
                            formatMetric(clientTime);
                        document.getElementById("asrTime").textContent =
                            formatMetric(metrics.asr_time);
                        document.getElementById("llmTime").textContent =
                            formatMetric(metrics.llm_time);
                        document.getElementById("ttsTime").textContent =
                            formatMetric(metrics.tts_time);

                        document.getElementById("transcription").textContent =
                            formatText(data.transcription);
                        responseEl.textContent = formatText(data.response);
                        responseEl.className = "live-text active";

                        const audioData = data.audio_base64 || data.audio;
                        if (audioData) {
                            const audioBlob = base64ToBlob(audioData, "audio/wav");
                            const audioUrl = URL.createObjectURL(audioBlob);
                            document.getElementById("audioPlayer").src = audioUrl;
                        }

                        status.textContent = "✅ Processing complete";
                        status.className = "status";
                        results.classList.add("show");
                    }
                } catch (error) {
                    status.innerHTML = `<div class="error-msg">❌ Error: ${error.message}</div>`;
                    status.className = "status";
                } finally {
                    processBtn.disabled = false;
                }
            });

            // ---------------------------------------------------------------
            // Binary streaming with typed frame protocol
            // ---------------------------------------------------------------

            let sharedAudioContext = null;

            function getAudioContext() {
                if (!sharedAudioContext) {
                    sharedAudioContext = new (
                        window.AudioContext || window.webkitAudioContext
                    )();
                }
                return sharedAudioContext;
            }

            /**
             * Stream binary audio with auto-detecting frame protocol.
             *
             * Supports BOTH:
             *   OLD: [4-byte length][WAV payload]
             *   NEW: [4-byte length][1-byte type][payload]
             *     type 0x01 = WAV audio, 0x02 = JSON metadata
             * Sentinel: 4 zero bytes
             *
             * Returns: { ttfa, metrics, response, transcription, audioChunks }
             */
            async function streamBinaryAudio(response, startTime) {
                const result = {
                    ttfa: null,
                    metrics: null,
                    response: "",
                    transcription: "",
                    audioChunks: 0,
                    responseChunks: [],
                };

                if (!response.body) return result;

                const reader = response.body.getReader();
                let buffer = new Uint8Array(0);
                const audioCtx = getAudioContext();
                if (audioCtx.state === "suspended") {
                    await audioCtx.resume();
                }
                let nextTime = audioCtx.currentTime + 0.05;

                const statusEl = document.getElementById("status");
                const responseEl = document.getElementById("response");
                const ttfaEl = document.getElementById("ttfaTime");

                console.log("[stream] Starting binary stream...");

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        console.log("[stream] Reader done");
                        break;
                    }
                    if (value && value.length) {
                        buffer = concatUint8(buffer, value);
                    }

                    const parsed = parseFrames(buffer);
                    buffer = parsed.remaining;

                    for (const frame of parsed.frames) {
                        if (frame.type === "audio") {
                            // First audio — record TTFA
                            if (result.ttfa === null) {
                                result.ttfa = (Date.now() - startTime) / 1000;
                                ttfaEl.textContent = formatMetric(result.ttfa);
                                colorTTFA(ttfaEl, result.ttfa);
                                console.log(`[stream] ⚡ TTFA: ${result.ttfa.toFixed(2)}s`);
                            }
                            result.audioChunks++;
                            statusEl.innerHTML =
                                `<span class="spinner"></span> Playing chunk ${result.audioChunks}...`;

                            // Get a proper ArrayBuffer for decodeAudioData
                            const ab = frame.data.buffer.slice(
                                frame.data.byteOffset,
                                frame.data.byteOffset + frame.data.byteLength
                            );
                            nextTime = await playWavFrame(audioCtx, ab, nextTime);
                        } else if (frame.type === "meta") {
                            const text = new TextDecoder().decode(frame.data);
                            try {
                                const meta = JSON.parse(text);
                                console.log("[stream] Meta:", meta.type, meta);
                                handleMetaFrame(meta, result);
                            } catch (e) {
                                console.warn("[stream] Bad meta frame:", e, text);
                            }
                        }
                    }

                    if (parsed.done) {
                        console.log("[stream] Sentinel reached");
                        break;
                    }
                }

                console.log("[stream] Complete:", result.audioChunks, "chunks,", 
                    "TTFA:", result.ttfa, "metrics:", result.metrics);
                return result;
            }

            /**
             * Handle a metadata JSON frame from the stream.
             */
            function handleMetaFrame(meta, result) {
                const responseEl = document.getElementById("response");

                if (meta.type === "transcription") {
                    result.transcription = meta.transcription || "";
                    document.getElementById("transcription").textContent =
                        result.transcription;
                    document.getElementById("asrTime").textContent =
                        formatMetric(meta.asr_time);
                } else if (meta.type === "text") {
                    // Live response text as chunks arrive
                    result.responseChunks.push(meta.text);
                    responseEl.textContent = result.responseChunks.join(" ");
                    responseEl.className = "live-text active";
                } else if (meta.type === "done") {
                    result.response = meta.response || result.responseChunks.join(" ");
                    result.metrics = meta.metrics || null;
                    responseEl.textContent = result.response;
                    responseEl.className = "live-text active";
                } else if (meta.type === "error") {
                    document.getElementById("status").innerHTML =
                        `<div class="error-msg">❌ ${meta.error}</div>`;
                }
            }

            /**
             * Auto-detecting frame parser.
             *
             * Detects protocol by inspecting the byte AFTER the 4-byte length:
             *   0x01/0x02 = NEW typed protocol (type + payload)
             *   0x52 ('R') or other = OLD protocol (raw WAV, starts with "RIFF")
             *
             * Returns: { frames: [{type: "audio"|"meta", data: Uint8Array}], remaining, done }
             */
            function parseFrames(buffer) {
                const frames = [];
                let offset = 0;
                let done = false;

                while (buffer.length - offset >= 4) {
                    const length =
                        (buffer[offset] << 24) |
                        (buffer[offset + 1] << 16) |
                        (buffer[offset + 2] << 8) |
                        buffer[offset + 3];

                    // Sentinel (end of stream)
                    if (length === 0) {
                        done = true;
                        offset += 4;
                        break;
                    }

                    // Sanity check: length shouldn't be absurdly large
                    if (length > 10 * 1024 * 1024) {
                        console.error("[parseFrames] Absurd length:", length, "at offset", offset);
                        done = true;
                        break;
                    }

                    // Need full frame data
                    if (buffer.length - offset - 4 < length) {
                        break;
                    }

                    // Auto-detect: peek at first byte of payload
                    const firstByte = buffer[offset + 4];

                    if (firstByte === FRAME_TYPE_AUDIO) {
                        // NEW typed frame: type=0x01 (audio)
                        const data = buffer.slice(offset + 5, offset + 4 + length);
                        frames.push({ type: "audio", data });
                    } else if (firstByte === FRAME_TYPE_META) {
                        // NEW typed frame: type=0x02 (metadata)
                        const data = buffer.slice(offset + 5, offset + 4 + length);
                        frames.push({ type: "meta", data });
                    } else {
                        // OLD untyped frame: entire payload is WAV audio
                        const data = buffer.slice(offset + 4, offset + 4 + length);
                        frames.push({ type: "audio", data });
                    }

                    offset += 4 + length;
                }

                return { frames, remaining: buffer.slice(offset), done };
            }

            function concatUint8(a, b) {
                const result = new Uint8Array(a.length + b.length);
                result.set(a, 0);
                result.set(b, a.length);
                return result;
            }

            async function playWavFrame(audioCtx, frame, startTime) {
                try {
                    const audioBuffer = await audioCtx.decodeAudioData(frame);
                    const source = audioCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(audioCtx.destination);
                    const safeStart = Math.max(
                        startTime,
                        audioCtx.currentTime + 0.02,
                    );
                    source.start(safeStart);
                    return safeStart + audioBuffer.duration;
                } catch (e) {
                    console.warn("Could not decode audio frame:", e);
                    return startTime;
                }
            }

            // ---------------------------------------------------------------
            // Audio conversion utilities
            // ---------------------------------------------------------------

            async function blobToWavArrayBuffer(blob) {
                const arrayBuffer = await blob.arrayBuffer();
                const audioCtx = new (
                    window.AudioContext || window.webkitAudioContext
                )();
                const decoded = await audioCtx.decodeAudioData(arrayBuffer);
                const wavBuffer = audioBufferToWav(decoded);
                return {
                    buffer: wavBuffer,
                    sampleRate: decoded.sampleRate,
                    channels: decoded.numberOfChannels,
                    sampleWidth: 2,
                };
            }

            function audioBufferToWav(audioBuffer) {
                const numChannels = audioBuffer.numberOfChannels;
                const sampleRate = audioBuffer.sampleRate;
                const format = 1;
                const bitDepth = 16;

                const samples = interleaveChannels(audioBuffer);
                const byteRate = (sampleRate * numChannels * bitDepth) / 8;
                const blockAlign = (numChannels * bitDepth) / 8;
                const buffer = new ArrayBuffer(44 + samples.length * 2);
                const view = new DataView(buffer);

                writeString(view, 0, "RIFF");
                view.setUint32(4, 36 + samples.length * 2, true);
                writeString(view, 8, "WAVE");
                writeString(view, 12, "fmt ");
                view.setUint32(16, 16, true);
                view.setUint16(20, format, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, byteRate, true);
                view.setUint16(32, blockAlign, true);
                view.setUint16(34, bitDepth, true);
                writeString(view, 36, "data");
                view.setUint32(40, samples.length * 2, true);

                floatTo16BitPCM(view, 44, samples);
                return buffer;
            }

            function interleaveChannels(audioBuffer) {
                const numChannels = audioBuffer.numberOfChannels;
                const length = audioBuffer.length;
                const result = new Float32Array(length * numChannels);
                let index = 0;
                for (let i = 0; i < length; i++) {
                    for (let ch = 0; ch < numChannels; ch++) {
                        result[index++] = audioBuffer.getChannelData(ch)[i];
                    }
                }
                return result;
            }

            function floatTo16BitPCM(view, offset, input) {
                for (let i = 0; i < input.length; i++, offset += 2) {
                    let s = Math.max(-1, Math.min(1, input[i]));
                    view.setInt16(
                        offset,
                        s < 0 ? s * 0x8000 : s * 0x7fff,
                        true,
                    );
                }
            }

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            function base64ToBlob(base64, type) {
                const bytes = atob(base64);
                const buffer = new ArrayBuffer(bytes.length);
                const view = new Uint8Array(buffer);
                for (let i = 0; i < bytes.length; i++) {
                    view[i] = bytes.charCodeAt(i);
                }
                return new Blob([buffer], { type });
            }

            function blobToBase64(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () =>
                        resolve(reader.result.split(",")[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            }
        </script>
    </body>
</html>
